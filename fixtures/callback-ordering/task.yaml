id: callback-ordering-v1
version: 1
repository: repository
runtime:
  image: patchbench-python-pytest:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
reviewer_ground_truth: hidden/reviewer.yaml
candidates:
  - path: candidates/correct.patch
    kind: control
    provenance: human_authored
  - path: candidates/reversed-callbacks.patch
    kind: known_regression
    provenance: observed_ai_style
checks:
  - name: visible-callback-runner-api
    type: pytest
    visibility: public
    path: public/tests
  - name: callbacks-keep-registration-order
    type: pytest
    visibility: hidden
    category: preservation
    path: hidden/tests
