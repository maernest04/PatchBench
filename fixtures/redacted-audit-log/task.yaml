id: redacted-audit-log-v1
version: 1
repository: repository
runtime:
  image: patchbench-python-pytest:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
reviewer_ground_truth: hidden/reviewer.yaml
candidates:
  - path: candidates/correct.patch
    kind: control
  - path: candidates/leaks-secret.patch
    kind: known_regression
checks:
  - name: visible-audit-event-format
    type: pytest
    visibility: public
    path: public/tests
  - name: audit-secret-redaction-policy
    type: pytest
    visibility: hidden
    category: safety
    path: hidden/tests
