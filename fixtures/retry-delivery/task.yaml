id: retry-delivery-v1
version: 1
repository: repository
runtime:
  image: patchbench-python-pytest:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
reviewer_ground_truth: hidden/reviewer.yaml
checks:
  - name: visible-first-delivery
    type: pytest
    visibility: public
    path: public/tests
  - name: retry-does-not-duplicate-delivery
    type: pytest
    visibility: hidden
    category: reliability
    path: hidden/tests
