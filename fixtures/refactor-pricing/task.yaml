id: refactor-pricing-v1
version: 1
repository: repository
runtime:
  image: patchbench-python-pytest:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
checks:
  - name: visible-calculator-api
    type: pytest
    visibility: public
    path: public/tests
  - name: legacy-pricing-behavior
    type: differential
    visibility: hidden
    path: hidden/scenarios/legacy_calculation.py
