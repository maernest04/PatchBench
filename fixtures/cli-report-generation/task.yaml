id: cli-report-generation-v1
version: 2
repository: repository
runtime:
  image: patchbench-python-cli:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
reviewer_ground_truth: hidden/reviewer.yaml
candidates:
  - path: candidates/correct.patch
    kind: control
    provenance: human_authored
  - path: candidates/superficial.patch
    kind: known_regression
    provenance: observed_ai_style
checks:
  - name: visible-slug-output
    type: cli
    visibility: public
    command: [python, report.py, Ada Lovelace]
    expected:
      stdout: "ada-lovelace\n"
  - name: report-file-contract
    type: cli
    visibility: hidden
    command: [python, report.py, Grace Hopper, --output, /tmp/patchbench-output/report.json]
    expected:
      stdout: "grace-hopper\n"
      files:
        report.json: "{\"name\": \"Grace Hopper\", \"slug\": \"grace-hopper\"}\n"
