id: cache-invalidation-v1
version: 1
repository: repository
runtime:
  image: patchbench-python-pytest:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
reviewer_ground_truth: hidden/reviewer.yaml
candidates:
  - path: candidates/correct.patch
    kind: control
  - path: candidates/stale-cache.patch
    kind: known_regression
checks:
  - name: visible-cache-behavior
    type: pytest
    visibility: public
    path: public/tests
  - name: deleted-users-are-not-readable
    type: pytest
    visibility: hidden
    path: hidden/tests
  - name: deletion-preserves-read-behavior
    type: differential
    visibility: hidden
    category: preservation
    path: hidden/scenarios/delete_then_read.py
