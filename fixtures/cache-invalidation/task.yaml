id: cache-invalidation-v1
version: 1
repository: repository
runtime:
  image: patchbench-python-pytest:0.1
  dockerfile: Dockerfile
constraints:
  timeout_seconds: 30
  memory_megabytes: 256
  cpu_cores: 1
checks:
  - name: visible-cache-behavior
    type: pytest
    visibility: public
    path: public/tests
  - name: deleted-users-are-not-readable
    type: pytest
    visibility: hidden
    path: hidden/tests
  - name: deletion-preserves-read-behavior
    type: differential
    visibility: hidden
    path: hidden/scenarios/delete_then_read.py
