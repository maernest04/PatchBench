[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbench"
version = "0.1.0"
description = "Execution-based evaluation for AI coding agents"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
patchbench = "patchbench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
